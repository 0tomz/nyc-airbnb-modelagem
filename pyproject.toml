[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-airbnb-eda"
version = "0.1.0"
description = "Reproducible EDA and preprocessing pipeline for NYC Airbnb data"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.6",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "shap>=0.46",
    "ipykernel>=6.29",
]

[project.scripts]
nyc-airbnb-eda = "nyc_airbnb_eda.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
